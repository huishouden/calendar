name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy halfway; superseded PR checks are fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: huishouden/pwa-kit/actions/leak-scan@v0
      - uses: huishouden/pwa-kit/actions/license-check@v0 # PolyForm Shield 1.0.0 (pwa-kit STANDARD.md "License")

  # The sync and the feed run against the Firestore emulator with the household's real rules
  # (huishouden/rules main), with Google and Firebase Auth faked.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: huishouden/rules
          path: .rules-repo
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/firebase/emulators
          key: ${{ runner.os }}-calendar-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Tests (Firestore emulator)
        run: bunx firebase emulators:exec --only firestore --project demo-huishouden-calendar "bun test"
        env:
          RULES_PATH: ${{ github.workspace }}/.rules-repo/firestore.rules
      - name: Bundle (wrangler dry run)
        run: bunx wrangler deploy --dry-run --outdir dist

  # Deploys on main once the repo has a CLOUDFLARE_API_TOKEN secret (README, "Deploy"); skipped
  # until then. Staging first, then production. Worker secrets stay in Cloudflare.
  deploy:
    needs: [leak-scan, build]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Cloudflare token is a secret of the `production` environment, whose deployment branches
    # are main alone: no other branch's run can read it.
    environment: production
    steps:
      - name: Cloudflare token present?
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: steps.token.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: steps.token.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.token.outputs.present == 'true'
        run: bun run deploy:staging && bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.token.outputs.present != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret; deploy with 'bun run deploy:staging && bun run deploy' locally (README)."
